name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The corpus tooling tests. Standard library unittest, nothing installed.
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash research/tests/run.sh

  # The Skill Bench tests, the way skillbench/tests/run.sh runs them: the UI
  # JavaScript syntax check on the runner, then pytest inside the built image
  # with the source mounted read-only.
  skillbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the bench image
        run: docker build --pull -t opinionated-omarchy/skillbench skillbench
      - run: bash skillbench/tests/run.sh

  # Luddite Scout reads the checkout: agent instruction files, hidden Unicode,
  # Actions, dependencies and build-time code. It runs nothing from this
  # repository. Fails on any HIGH or MEDIUM finding that .scout-accepted.json
  # does not list with a reason, on a listed entry that no longer matches a
  # finding, and on a check that could not finish.
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: TechLuddite/luddite-scout-action@b34b6a811b70e99c51a8e9b1f4a1aeecc786d99d
        with:
          fail-on: medium
          accepted: .scout-accepted.json
          name: ${{ github.repository }}
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
