name: Build and publish the corpus site

# The site is ~4.3 MB regenerated wholesale on every build, so it is NOT committed --
# see the note on docs/ in .gitignore. CI builds it from the JSONL and publishes the
# artifact, which keeps the churn out of history entirely.
#
# REQUIRES the repository to be public (or Pages enabled on a paid plan), and
# Settings > Pages > Source set to "GitHub Actions". Until then this workflow builds and
# uploads on push but the deploy step will fail -- which is the honest failure mode, since
# a green build that published nothing would be worse.

on:
  push:
    branches: [main]
    paths:
      - 'research/data/problems.jsonl'
      - 'research/data/categories.json'
      - 'research/tools/build_site.py'
      # The generator COPIES these into the site, so a font or licence change must
      # republish -- otherwise the live site keeps serving the old pair and, worse, could
      # serve a font whose licence file no longer matches it.
      - 'research/assets/fonts/**'
      # The "how this was built" cards now render these onto the site, so a change to any
      # of them changes a published page. Without these the site would silently serve a
      # stale copy of its own documentation.
      - 'research/README.md'
      - 'skillbench/README.md'
      - 'skillbench/MODELS.md'
      - 'skillbench/RESULTS.md'
      - 'skillbench/ZEN.md'
      - 'JOURNAL.md'
      - 'writeups/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'      # stdlib only; the generator has no dependencies

      - name: Build the site
        working-directory: research
        run: python3 tools/build_site.py

      - name: Sanity-check the output
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/search.json
          # One page per record, or something silently dropped records.
          want=$(grep -c . research/data/problems.jsonl)
          got=$(find docs/records -name '*.html' | wc -l)
          echo "records in corpus: $want   pages built: $got"
          test "$want" -eq "$got"
          # The provenance disclaimer is the reason this site exists; if the generator
          # ever stops emitting it, fail loudly rather than publish a corpus that reads
          # as uniformly trustworthy.
          # Every record page must carry an audit LED, and at least one must carry a
          # non-clean one, or the disclaimer path was never exercised. Do not assert a
          # single status: UNAUDITED legitimately dropped to zero on 2026-09-06.
          labelled=$(grep -rlE '>(AUDITED|CORRECTED|UNAUDITED)<' docs/records/ | wc -l)
          echo "record pages carrying an audit LED: $labelled"
          test "$labelled" -eq "$got" || { echo "some record pages render no audit provenance"; exit 1; }
          grep -qrE '>(CORRECTED|UNAUDITED)<' docs/records/ || { echo "no corrected or unaudited provenance rendered"; exit 1; }
          # Every doc card must land on a real page. A missing one would render as a dead
          # link on the front page rather than failing the build.
          for d in research-readme skillbench results models zen writeups journal; do
            test -s "docs/$d.html" || { echo "missing doc page: $d.html"; exit 1; }
          done
          grep -q 'href="models.html"' docs/index.html || { echo "doc cards not linked"; exit 1; }
          # OFL clause 2: every copy of the font must carry its licence. If the generator
          # ever ships the woff2 without it, that is a licence breach, so fail the build.
          test -f docs/fonts/DepartureMono-Regular.woff2
          test -f docs/fonts/DepartureMono-LICENSE.txt
          test -f docs/fonts/OmarchyFont.woff2
          test -f docs/fonts/OmarchyFont-LICENSE.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
